[project]
name = "hades"
version = "1.0.0"
description = "htmc discord bot"
readme = "README.md"
authors = [
    { name = 'Emma "R1shy" Kadlecek', email = "kadlecekemma@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "discord.py>=2.3.2", 
    "python-dotenv>=1.0.1"
]

[project.scripts]
hades = "hades:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.350",
    "ruff>=0.16.9",
    "sqv>=0.5.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E", 
    "W",
    "F",
    "I",
    "N",
    "B",
    "C4",
    "UP",
    "ASYNC",
    "RUF"
]
ignore = [
    "B008",
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
typeCheckingMode = "strict"

reportMissingTypeStubs = true
reportUnknownArgumentType = true
reportUnknownLambdaType = true
reportUnknownMemberType = true
reportUnknownParameterType = true
reportUnknownVariableType = true
reportUntypedFunctionDecorator = true

exclude = [
    "**/.venv",
    "**/__pycache__",
]

