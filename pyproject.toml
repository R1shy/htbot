[project]
name = "hades"
version = "1.0.0"
description = "htmc discord bot"
readme = "README.md"
authors = [
    { name = 'Emma "R1shy" Kadlecek', email = "kadlecekemma@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "discord>=2.3.2",
    "dotenv>=0.9.9",
    "pathlib>=1.0.1",
]

[project.scripts]
hades = "hades:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
]
